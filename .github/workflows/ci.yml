# The same gate as the local /verify-all skill: typecheck, lint, tests,
# production build. No secrets needed — prisma generate is offline, db.ts
# falls back to a placeholder connection string, and the Anthropic key is
# only read at request time.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
