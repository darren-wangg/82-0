# The same gate as the local /verify-all skill: typecheck, lint, tests,
# production build. No secrets needed — prisma generate is offline, db.ts
# falls back to a placeholder connection string, and the Anthropic key is
# only read at request time.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Generated route types (PageProps etc.) don't exist until a build —
      # typegen creates them without one, per the Next CLI docs' CI recipe.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Smoke the client-only core game loop (home → draft → sim + budget entry)
  # in the mobile WebKit profile. Needs no database or secrets.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
